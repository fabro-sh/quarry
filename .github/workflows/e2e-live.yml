name: E2E Live CI

# The live-collaboration Playwright suite drives a real quarry server
# (lib-documents build) plus the vite dev server — the only coverage that
# crosses the Rust/browser boundary, so it runs on changes to either side.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ui/**"
      - "fixtures/**"
      - ".github/workflows/e2e-live.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ui/**"
      - "fixtures/**"
      - ".github/workflows/e2e-live.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  QUARRY_RELEASE_SERVER: "1"
  QUARRY_PRODUCTION_UI: "1"

jobs:
  e2e-live:
    name: E2E (live server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev fuse3 unzip
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.22.1
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile
      # quarry-server embeds ui/dist at compile time (rust_embed)
      - uses: ./.github/actions/setup-document
      - name: Build browser bundle
        working-directory: ui
        run: bun run build
      # Prebuild so the Playwright webServer readiness budget (120s) is not
      # spent compiling; the config's `cargo run` then reuses this build.
      - name: Build quarry server
        run: cargo build --locked --release -p quarry --features lib-documents
      - name: Install Playwright browsers
        timeout-minutes: 5
        working-directory: ui
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Check large-document responsiveness
        timeout-minutes: 20
        working-directory: ui
        env:
          QUARRY_PERFORMANCE: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: performance-results.json
        run: |
          node node_modules/playwright/cli.js test -c playwright.live.config.ts --grep "agent review arrives during sustained typing at block 0" --project=chromium --repeat-each=3 --workers=1 --reporter=line,json
          python3 - <<'CHECK'
          import json
          with open('performance-results.json') as report:
              stats = json.load(report)['stats']
          print(stats)
          assert stats['expected'] == 3, stats
          assert stats['unexpected'] == 0, stats
          CHECK
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-diagnostics
          path: |
            ui/performance-results.json
            ui/test-results

name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "crates/quarry-document/**"
      - "crates/quarry-document-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-document/**"
      - "crates/quarry-markdown/**"
      - "fixtures/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "ui/**"
      - "crates/quarry-document/**"
      - "crates/quarry-document-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-document/**"
      - "crates/quarry-markdown/**"
      - "fixtures/**"
      - ".github/workflows/typescript.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: ui

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: ./.github/actions/setup-document
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: ./.github/actions/setup-document
      - run: bun install --frozen-lockfile
      - run: bun run check:architecture

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: ./.github/actions/setup-document
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: ./.github/actions/setup-document
      - run: bun install --frozen-lockfile
      - run: bun run build

  test-macos:
    name: Test (macOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: ./.github/actions/setup-document
      - run: bun install --frozen-lockfile
      - run: bun run test
